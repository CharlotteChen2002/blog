<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello World | llyのblog</title>
    <meta name="description" content=" 突然感觉有一个博客是一件很酷的事情，于是尝试建了一个。 感觉自己不是很会写东西的人，不过为了每年的域名订阅费用还是要写一点的。想要把自己会写的东西列在这里： 上过的好玩的课 申请的过程 面基经历 more 希望生活可以更有趣，这样就可以多写一点博客。 ">
    <meta property="og:type" content="article">
    <meta property="og:title" content="Hello World">
    <meta property="og:locale" content="zh_CN">
    <meta property="article:author" content="liuly">
    <meta property="article:tag" content="杂谈">
    
  </head>
  <body>
    <main style="display: none;">
      <p>突然感觉有一个博客是一件很酷的事情，于是尝试建了一个。</p>
<p>感觉自己不是很会写东西的人，不过为了每年的域名订阅费用还是要写一点的。想要把自己会写的东西列在这里：</p>
<ul>
<li>上过的好玩的课</li>
<li>申请的过程</li>
<li>面基经历</li>
</ul>
<!-- more -->
<p>希望生活可以更有趣，这样就可以多写一点博客。</p>

    </main>
    <script type="text/javascript">
      var main = document.querySelector('main');
      var content = main.innerHTML;
      sessionStorage.setItem('helloworld', content);
      sessionStorage.setItem('helloworld__time', Date.now().toString());
      
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </body>
</html>
